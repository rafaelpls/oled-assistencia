services:
  database:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oled}
      POSTGRES_USER: ${POSTGRES_USER:-oled}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: .
      target: backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-oled}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-oled}?schema=public}
    command:
      [
        'sh',
        '-c',
        'node node_modules/prisma/build/index.js migrate deploy && node dist/backend/prisma/seed.js',
      ]
    depends_on:
      database:
        condition: service_healthy
  backend:
    build:
      context: .
      target: backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-oled}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-oled}?schema=public}
      NODE_ENV: production
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      UPLOAD_DIR: /app/uploads
    volumes:
      - photos:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
  frontend:
    build:
      context: .
      target: frontend
      args:
        API_INTERNAL_URL: http://backend:4000
    environment:
      API_INTERNAL_URL: http://backend:4000
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  photos:
